name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure Android user directory
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install project SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare build timestamp and optional stable test key
        env:
          TEST_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "SOURCE_DATE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ -n "$TEST_KEYSTORE" ]; then
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
            chmod 600 "$ANDROID_USER_HOME/debug.keystore"
            echo 'SIGNING_DESCRIPTION=Existing test key (update-compatible)' >> "$GITHUB_ENV"
          else
            echo '::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. This APK uses a new debug key; installing it over an existing build may require uninstalling that build.'
            echo 'SIGNING_DESCRIPTION=Temporary debug key (not update-compatible)' >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Prepare APK and checksum
        id: apk
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path('app/build/outputs/apk/debug')
          metadata = json.loads((source / 'output-metadata.json').read_text())
          element, = metadata['elements']
          version = element['versionName']
          name = f"B-Cycle-{version}-debug-{os.environ['GITHUB_RUN_NUMBER']}.apk"
          target = pathlib.Path('apk-artifact')
          target.mkdir()
          apk = target / name
          shutil.copyfile(source / element['outputFile'], apk)
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          (target / (name + '.sha256')).write_text(f'{checksum}  {name}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'path={apk}\nname={name}\nversion={version}\nsha256={checksum}\n')
          PY
          for apk in apk-artifact/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: B-Cycle-debug-${{ github.run_number }}
          path: apk-artifact/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build summary
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## BICYCLE Debug APK'
            echo
            echo "[$APK_NAME herunterladen]($ARTIFACT_URL)"
            echo
            echo "Version: $APK_VERSION · Commit: $GITHUB_SHA"
            echo
            echo "Signierung: $SIGNING_DESCRIPTION"
            echo
            echo "SHA-256: \`$APK_SHA256\`"
            echo
            echo 'Das Artefakt enthält die APK und ihre Prüfsumme und bleibt 30 Tage verfügbar.'
          } >> "$GITHUB_STEP_SUMMARY"
